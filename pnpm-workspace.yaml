packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true

catalogs:
  dev:
    "@types/node": ^26.1.2
    typescript: 6.0.3

  test:
    "@vitest/coverage-v8": 4.1.10
    vitest: 4.1.10
    vite: npm:@voidzero-dev/vite-plus-core@0.2.9
    vite-plus: 0.2.9

  lint:
    case-police: ^2.2.1
    jscpd: 5.0.16
    linkinator: ^8.0.3
    markdownlint-cli: ^0.49.1

  build:
    lefthook: ^2.1.10
    turbo: ^2.10.8

minimumReleaseAgeExclude:
  - jscpd-darwin-arm64@5.0.16
  - jscpd-darwin-x64@5.0.16
  - jscpd-linux-arm64-gnu@5.0.16
  - jscpd-linux-x64-gnu@5.0.16
  - jscpd-linux-x64-musl@5.0.16
  - jscpd-windows-x64-msvc@5.0.16
  - jscpd@5.0.16

overrides:
  minimatch: ">=10.2.6"
  vite: catalog:test
  vitest: catalog:test
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
