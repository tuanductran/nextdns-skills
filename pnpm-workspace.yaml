packages:
  - "packages/*"

allowBuilds:
  esbuild: true
  lefthook: true

catalogs:
  dev:
    "@types/mdast": 4.0.4
    "@types/node": ^26.1.2
    typescript: 6.0.3

  test:
    "@vitest/coverage-v8": 4.1.11
    vitest: 4.1.11
    vite: npm:@voidzero-dev/vite-plus-core@0.2.9
    vite-plus: 0.2.9

  lint:
    case-police: ^2.2.1
    jscpd: 5.0.16
    linkinator: ^8.0.3
    markdownlint-cli: ^0.49.1

  runtime:
    mdast-util-to-string: 4.0.0
    remark-frontmatter: 5.0.0
    remark-gfm: 4.0.1
    remark-parse: 11.0.0
    unified: 11.0.5
    valibot: 1.4.2
    yaml: 2.9.0

  build:
    lefthook: ^2.1.10
    turbo: ^2.10.8

minimumReleaseAgeExclude:
  - jscpd-darwin-arm64@5.0.16
  - jscpd-darwin-x64@5.0.16
  - jscpd-linux-arm64-gnu@5.0.16
  - jscpd-linux-x64-gnu@5.0.16
  - jscpd-linux-x64-musl@5.0.16
  - jscpd-windows-x64-msvc@5.0.16
  - jscpd@5.0.16

overrides:
  esbuild: "0.28.2"
  nanoid: "3.3.18"
  vite: catalog:test
  vitest: catalog:test

peerDependencyRules:
  allowedVersions:
    vite: "*"
    vitest: "*"
